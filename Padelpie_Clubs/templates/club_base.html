<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Padelpie Clubs</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body class="app"><div class="top-glow"></div><div class="shell"><header class="nav"><a class="brand" href="{{ url_for('index') }}"><img src="/static/assets/padelpie-logo.png" alt="Padelpie"><span>Padelpie Clubs</span></a><nav class="navlinks">{% if manager %}<a href="{{ url_for('dashboard') }}">Dashboard</a><a href="{{ url_for('add_club') }}">+ Ajouter un terrain</a><a class="logout" href="{{ url_for('logout') }}">↪</a>{% else %}<a href="{{ url_for('login') }}">Connexion</a><a href="{{ url_for('register') }}">Créer un compte</a>{% endif %}</nav></header>{% with messages=get_flashed_messages(with_categories=true) %}{% for category,m in messages %}<div class="flash {{category}}">{{m}}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</div></body></html>
