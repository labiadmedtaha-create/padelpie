{% extends 'club_base.html' %}{% block content %}<section class="page-head"><div><div class="eyebrow">NOUVEAU CLUB</div><h1>Ajouter votre <span class="gradient">terrain</span>.</h1><p class="sub">Ces informations seront visibles dans Padelpie.</p></div></section><form method="post" enctype="multipart/form-data" class="glass-card form" style="max-width:900px;margin:auto"><div class="profile-columns"><label>Nom du club<input name="name" required></label><label>Ville<select name="city">{% for c in cities %}<option>{{c}}</option>{% endfor %}</select></label><label>Quartier / zone<input name="area"></label><label>Nombre de terrains<input type="number" name="courts" min="1" value="2" required></label><label>Prix à partir de (DH)<input type="number" name="price_from" min="0" value="120"></label><label>Téléphone / WhatsApp<input name="phone"></label><label>Horaires complets<input name="hours" placeholder="08:00–00:00"></label><label>Photo du club<input type="file" name="image" accept="image/png,image/jpeg,image/webp"></label><label>Type de terrains<select name="indoor"><option value="0">Panoramique / extérieur</option><option value="1">Indoor / couvert</option></select></label></div><label>Adresse complète<textarea name="address" required rows="3"></textarea></label><label>Description<textarea name="description" rows="4" placeholder="Services, vestiaires, parking, réservation..."></textarea></label><button class="btn big">Publier mon club sur Padelpie →</button></form>{% endblock %}
